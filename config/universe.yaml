# Value-chain map (docs/04 Layer 0): the structural relationships the analyst reasons over.
# Demand originates at AI labs / hyperscaler capex and flows downstream. A reasoning aid, NOT
# the traded list. Maintained at weekly/monthly review.
value_chain_map:
  demand_sources: ["AI labs (Anthropic, OpenAI — private)", MSFT, GOOGL, AMZN, META, ORCL]
  flows_to:
    datacenter_buildout: [VRT, DELL, "datacenter REITs / utilities — see downstream_candidates"]
    compute_silicon: [NVDA, AMD, AVGO, MRVL]
    networking_interconnect: [ANET, AVGO, MRVL, ALAB, CRDO]
    memory: [MU]
    foundry: [TSM]                         # advanced-packaging (CoWoS) capacity = structural choke point
    equipment_enabling_foundry: [ASML, AMAT, LRCX, KLAC]
    design_tools: [SNPS, CDNS]
  key_bottlenecks: ["TSMC advanced packaging (CoWoS) capacity", "HBM supply", "datacenter power / grid"]

# DYNAMIC UNIVERSE (docs/02 §3a): the edge is finding profitable dynamics and acting on EVERY
# part of a chain — so the system may discover and propose new value-chain nodes to trade.
# Discovery != auto-trade: a proposed node is tradeable only after it clears the promotion gate,
# which preserves cost + anti-manipulation discipline.
node_promotion_gate:
  - large/mid cap + liquid only (market_cap >= 5e9, avg_daily_volume_usd >= 1e8) — no microcaps, the manipulation defense is non-negotiable
  - has a dossier + at least one whitelisted source domain added
  - passes a structural thesis (chain + priced_in_check + falsifiers, docs/04 Layer 5)
  - sits inside the AI-infrastructure theme (not an unrelated sector — that's the focus rule)
  - added at a review, or intra-month if flagged urgent; logged; each node costs search budget

# CHAIN-WALKING DISCOVERY (docs/04): a PRIORITIZED behavior, not a list. When the system validates
# a profitable / strengthening value chain, it should proactively walk to LINKED nodes and research
# them with priority — then gate each before trading. No tickers are hardcoded on purpose: the
# universe grows from what the walk discovers, not from a maintained shopping list. (One example of
# the mechanism, not a list: a datacenter-buildout chain implies power + physical-buildout exposure
# — reached by walking the edges, never by being pre-listed.)
chain_walking_discovery:
  prioritize: true            # linked-node research outranks generic news triage once a chain is validated
  walk_edges: [supplies_to, buys_from, funds, shares_bottleneck_with, physical_dependency_of]
  then: node_promotion_gate   # discovery proposes; the gate decides tradeability
  # sizing discipline is SEPARATE — see docs/05 concentration: walk freely to discover, cap hard to size

benchmarks:
  primary: equal_weight_universe   # computed internally from traded list
  secondary: [SOXX, QQQ]

constraints:
  listing: US exchanges only (NYSE/Nasdaq)
  min_market_cap_usd: 5e9
  min_avg_daily_volume_usd: 1e8

# Web-search domain whitelist (docs/04). Server-enforced via allowed_domains.
