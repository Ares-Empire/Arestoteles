name: ci

# Runs only when started by hand (Actions tab, "Run workflow"): the repository is private, so every run
# costs the organization's Actions minutes, and the same tests run locally for free (python -m pytest -q).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the server's Python
      - run: ruby --version         # the made-up test vault's check runs with it
      - run: python -m pip install -q -e '.[dev]'
      # No network in the tests: a temporary git remote, a fake PocketBase, a stub market-data client.
      - run: python -m pytest -q
