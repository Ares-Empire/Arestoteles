[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arestoteles"
version = "1.0.0"
description = "Arestoteles: the server of Patrik's Weltbild vault for the iPhone app (and the arestoteles.de website)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
