[build-system]
requires = ["setuptools>=77"]  # 77: the SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "arestoteles"
version = "1.0.0"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
description = "Arestoteles: the server of Patrik's Weltbild vault for the iPhone app (and the arestoteles.de website)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "markdown-it-py>=3.0",
  # search's meaning side (docs/API.md → Search): the model runs on the CPU through ONNX Runtime, no torch
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "tokenizers>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
